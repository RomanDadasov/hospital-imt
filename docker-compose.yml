services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: roman913/hospital-frontend:latest
    restart: always
    ports:
      - "3000:5173"
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: roman913/hospital-backend:latest
    restart: always
    ports:
      - "5171:5171"
    environment:
      - ConnectionStrings__HospitalDBConnectionString=Server=db,1433;Database=HospitalManagementDB;User ID=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - app-network

volumes:
  sql_data:

networks:
  app-network:
    driver: bridge
